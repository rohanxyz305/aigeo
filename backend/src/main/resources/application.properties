# Local secrets live in backend/.env (KEY=value lines); hosted deployments use real environment variables.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# H2 file database by default; set DATABASE_URL to a jdbc:postgresql://... URL in production.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/rankchecker}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Report streaming can run for a couple of minutes.
spring.mvc.async.request-timeout=180000

app.jwt-secret=${JWT_SECRET:}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
app.deepseek.api-key=${DEEPSEEK_API_KEY:}
app.deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
